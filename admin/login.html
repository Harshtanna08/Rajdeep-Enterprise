<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Rajdeep Enterprise</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --admin-bg: #0f172a;
            --admin-surface: #1e293b;
            --admin-surface-hover: #334155;
            --admin-border: #334155;
            --admin-primary: #3b82f6;
            --admin-primary-hover: #2563eb;
            --admin-text: #f1f5f9;
            --admin-text-dim: #94a3b8;
            --admin-danger: #ef4444;
            --admin-success: #10b981;
            --admin-radius: 12px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--admin-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--admin-text);
            position: relative;
            overflow: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(59,130,246,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(16,185,129,0.06) 0%, transparent 50%);
            animation: bgFloat 20s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-3%, -3%); }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
        }

        .login-card {
            background: var(--admin-surface);
            border: 1px solid var(--admin-border);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
        }

        .portal-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(59,130,246,0.12);
            color: var(--admin-primary);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 100px;
            margin-bottom: 1.5rem;
        }

        .portal-badge::before {
            content: '🔒';
            font-size: 0.75rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header .logo-shield {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--admin-primary), #8b5cf6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            font-size: 1.8rem;
            box-shadow: 0 8px 24px rgba(59,130,246,0.25);
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.35rem;
        }

        .login-header p {
            color: var(--admin-text-dim);
            font-size: 0.88rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--admin-text-dim);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: var(--admin-bg);
            border: 1.5px solid var(--admin-border);
            border-radius: 10px;
            color: var(--admin-text);
            font-family: var(--font);
            font-size: 0.95rem;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--admin-primary);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }

        .form-input::placeholder {
            color: #475569;
        }

        .btn-login {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--admin-primary), var(--admin-primary-hover));
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: var(--font);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(59,130,246,0.35);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-login .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        .btn-login.loading .btn-text { display: none; }
        .btn-login.loading .spinner { display: block; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.25);
            color: #fca5a5;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .error-message.visible {
            display: flex;
        }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--admin-border);
        }

        .login-footer a {
            color: var(--admin-text-dim);
            text-decoration: none;
            font-size: 0.82rem;
            transition: color 0.2s;
        }

        .login-footer a:hover {
            color: var(--admin-primary);
        }

        .rate-limit-notice {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.75rem;
            color: #475569;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 1.75rem;
            }
            .login-header h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="portal-badge">Admin Portal</div>
                <div class="logo-shield">🛡️</div>
                <h1>Admin Login</h1>
                <p>Rajdeep Enterprise Management System</p>
            </div>

            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminEmail" class="form-label">Admin Email</label>
                    <input type="email" id="adminEmail" class="form-input"
                           placeholder="admin@rajdeepenterprise.com"
                           required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="adminPassword" class="form-label">Password</label>
                    <input type="password" id="adminPassword" class="form-input"
                           placeholder="Enter your password"
                           required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <span class="btn-text">Sign In to Admin Panel</span>
                    <div class="spinner"></div>
                </button>

                <div class="error-message" id="errorMessage">
                    <span>⚠️</span>
                    <span id="errorText"></span>
                </div>
            </form>

            <div class="login-footer">
                <a href="/">← Back to Website</a>
            </div>

            <div class="rate-limit-notice">
                🔐 Protected by rate limiting · Max 5 attempts per 15 minutes
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('adminLoginForm');
        const btnLogin = document.getElementById('btnLogin');
        const errorEl = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.classList.remove('visible');

            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;

            if (!email || !password) {
                showError('Please enter both email and password.');
                return;
            }

            btnLogin.classList.add('loading');
            btnLogin.disabled = true;

            try {
                const res = await fetch('/api/auth/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (data.success) {
                    // Redirect to admin dashboard
                    window.location.href = '/admin/dashboard';
                } else {
                    showError(data.error || 'Login failed. Please check your credentials.');
                    btnLogin.classList.remove('loading');
                    btnLogin.disabled = false;
                }
            } catch (err) {
                showError('Unable to connect to server. Please try again.');
                btnLogin.classList.remove('loading');
                btnLogin.disabled = false;
            }
        });

        function showError(msg) {
            errorText.textContent = msg;
            errorEl.classList.add('visible');
        }
    </script>
</body>
</html>
